{% load static %}<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboards · Zong RCTO Central</title>
<meta name="theme-color" content="#040C07">
{% include "site/_art.html" %}<script src="{% static 'site/js/theme.js' %}"></script>
<link rel="icon" href="{% static 'site/img/favicon.svg' %}" type="image/svg+xml">
<link rel="stylesheet" href="{% static 'site/css/site.css' %}">
<link rel="stylesheet" href="{% static 'dashboard/css/dashboard.css' %}">

</head>
<body class="app">
<header class="appbar">
  <div class="in">
    <div class="row1">
      {% include "site/_brand.html" %}
      <nav class="tabs" id="tabs" aria-label="Dashboards">
        <a href="#complaints" data-k="complaints">Complaints &amp; Fiber</a>
        <a href="#fops" data-k="fops">FOPs C1–C6</a>
        <a href="#drivers" data-k="drivers">Network</a>
        <a href="#scorecard" data-k="scorecard">Scorecard</a>
      </nav>
      <div class="tools">
        <a class="pillbtn" data-nav href="{% url 'grid_report:report' %}" title="Grid Excellence dashboard"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Grid</a>
        <button class="icon-btn" id="fsBtn" type="button" aria-label="Fullscreen" title="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
        <span class="periodchip" id="periodLbl"></span>
        <a class="icon-btn" data-nav href="{% url 'home' %}" aria-label="Home" title="Home"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 10 4l7 5.5V16a1 1 0 0 1-1 1h-3.5v-5h-5v5H4a1 1 0 0 1-1-1z"/></svg></a>
        {% include "site/_theme_toggle.html" %}
      </div>
    </div>
    <div class="row2">
      <span class="glab">Chart</span>
      <button type="button" class="vchip on" id="vals" aria-pressed="true">Values</button>
      <span class="count">RCTO Central · Routing team · FOPs C1–C6</span>
    </div>
  </div>
</header>
<header class="hero page">
  <div class="wrap">
    <div class="titles"><div class="crumb">RCTO Central</div><h1 id="h1"></h1><p id="sub"></p></div>
    <div class="kpis" id="hero-kpis"></div>
  </div>
</header>
<main class="wrap"><div class="story" id="story"></div><div id="view"></div></main>
<div class="tip" id="tip"></div>

<script>
const THEME = {"teams": ["#2F6BFF", "#00B8A9", "#FFB020", "#8B5CF6", "#F0558A", "#64748B"], "complaints": "#F0147F", "cuts": "#FF9A1F", "avail": "#14B870", "ls": "#7B61FF", "ink": "#0A1A10"};
const DATA = {{ data_json|safe }};
</script>
<script src="{% static 'dashboard/js/d3.min.js' %}"></script>
<script src="{% static 'dashboard/js/app.js' %}"></script>
<script src="{% static 'dashboard/js/scorecard.js' %}"></script>
<script src="{% static 'dashboard/js/boot.js' %}"></script>
<script>(function(){var l=DATA.complaints.labels;document.getElementById('periodLbl').textContent=l[0]+'–'+l[l.length-1]+' 2026';})();</script>
{% include "site/_fs.html" %}
</body>
</html>
